name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версия зафиксирована, а не "stable": сборки этого агента должны
          # быть воспроизводимыми, а плавающая версия компилятора это ломает.
          go-version: '1.23.4'
          check-latest: false

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          # Трей — код только под Windows, на Linux он не компилируется вовсе,
          # поэтому проверяется отдельно с GOOS=windows.
          GOOS=windows go vet ./...

      - name: Тесты
        run: go test -race ./...

      - name: Зависимостей нет
        run: |
          # Обещание «только стандартная библиотека» — часть того, почему этому
          # агенту можно доверять. Проверяем его машиной, а не на слово.
          if [ -f go.sum ] || grep -q "^require" go.mod; then
            echo "Появилась внешняя зависимость. Это меняет цепочку доверия —"
            echo "либо уберите её, либо осознанно обновите README."
            cat go.mod; exit 1
          fi

      - name: Ни одного запуска внешних программ, кроме открытия браузера
        run: |
          # exec.Command разрешён ровно в одном месте — открыть окно настроек.
          hits=$(grep -rln "exec.Command" --include="*.go" . | grep -v "cmd/pulse-agent/browser.go" || true)
          if [ -n "$hits" ]; then
            echo "Запуск внешних программ вне browser.go:"; echo "$hits"; exit 1
          fi

  build:
    name: Сборка ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          check-latest: false
      - name: Сборка
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          flags="-s -w"
          # Под Windows — без консольного окна.
          [ "$GOOS" = "windows" ] && flags="$flags -H windowsgui"
          go build -trimpath -ldflags "$flags" -o /tmp/pulse-agent ./cmd/pulse-agent
